title: Lanka Software Foundation
tagline: Open source for public good
author: Lanka Software Foundation
email: contact@opensource.lk
description: >- # this means to ignore newlines until "baseurl:"
  Lanka Software Foundation is a non-profit organization that promotes
  the development of Free and Open Source Software (FOSS) in Sri Lanka by
  giving Sri Lankan developers the environment, facilities and support
  they need to create and maintain FOSS projects.
#baseurl: "" # the subpath of your site, e.g. /blog
#url: "" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb
github_username: LSFLK

# Build settings
theme: minima

# Force custom navigation
# The main menu is set in _data/navigation.yml
header_pages: []

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ---- Review copy only (this branch is never merged into the real site) ----
# The review site lives at https://romesh-w.github.io/lsf-website-draft/
url: "https://romesh-w.github.io"
baseurl: "/lsf-website-draft"
# Shows a "Draft for review" banner and asks search engines not to list the site
draft_review: true
draft_review_text: "Draft for review only. This is not the live opensource.lk website."
