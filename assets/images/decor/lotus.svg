<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" fill="none" stroke="#8a1616" stroke-opacity="0.5" stroke-width="0.8">
  <!-- A lotus pattern, a common motif in Sri Lankan art -->
  <circle r="96" stroke-opacity="0.25"/>
  <circle r="90" stroke-dasharray="2 3" stroke-opacity="0.3"/>
  <circle r="14"/>
  <circle r="8" fill="#8a1616" fill-opacity="0.12"/>
  <g id="outer">
    <path d="M0 -84 C14 -70 16 -46 0 -22 C-16 -46 -14 -70 0 -84 Z"/>
  </g>
  <use href="#outer" transform="rotate(30)"/>
  <use href="#outer" transform="rotate(60)"/>
  <use href="#outer" transform="rotate(90)"/>
  <use href="#outer" transform="rotate(120)"/>
  <use href="#outer" transform="rotate(150)"/>
  <use href="#outer" transform="rotate(180)"/>
  <use href="#outer" transform="rotate(210)"/>
  <use href="#outer" transform="rotate(240)"/>
  <use href="#outer" transform="rotate(270)"/>
  <use href="#outer" transform="rotate(300)"/>
  <use href="#outer" transform="rotate(330)"/>
  <g id="inner">
    <path d="M0 -54 C9 -44 10 -30 0 -16 C-10 -30 -9 -44 0 -54 Z" fill="#8a1616" fill-opacity="0.06"/>
  </g>
  <use href="#inner" transform="rotate(45)"/>
  <use href="#inner" transform="rotate(90)"/>
  <use href="#inner" transform="rotate(135)"/>
  <use href="#inner" transform="rotate(180)"/>
  <use href="#inner" transform="rotate(225)"/>
  <use href="#inner" transform="rotate(270)"/>
  <use href="#inner" transform="rotate(315)"/>
</svg>
